<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>الأنشطة التنموية | Al-Hossam Hassan</title>
    <meta
      name="description"
      content="أنشطة منزلية مصورة لتنمية مهارات الطفل في مختلف المراحل العمرية."
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />

    <style>
      .activities-header {
        padding: 60px 0 30px;
      }
      .page-title h2 {
        font-size: 2.5rem;
        color: var(--primary-color);
        margin-bottom: 10px;
      }

      /* Filters Styling */
      .filters-container {
        background: var(--white);
        padding: 20px;
        border-radius: 20px;
        box-shadow: var(--shadow);
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
        margin-bottom: 40px;
        border: 1px solid #eee;
      }
      .filter-group {
        flex: 1;
        min-width: 200px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .filter-group label {
        font-size: 0.85rem;
        font-weight: bold;
        color: var(--primary-color);
        padding-right: 5px;
      }

      .filters-container select,
      .filters-container input {
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #ddd;
        font-family: inherit;
        outline: none;
        background: #f9f9f9;
        transition: var(--transition);
      }
      .filters-container select:focus,
      .filters-container input:focus {
        border-color: var(--accent-color);
        background: #fff;
      }

      /* Activity Card Enhancements */
      .activity-card {
        background: var(--white);
        border-radius: 25px;
        overflow: hidden;
        transition: var(--transition);
        border: 1px solid #eee;
        display: flex;
        flex-direction: column;
      }
      .activity-card:hover {
        transform: translateY(-10px);
        box-shadow: var(--shadow);
      }

      .act-thumb {
        position: relative;
        height: 200px;
        overflow: hidden;
      }
      .act-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        transition: 0.5s;
      }
      .activity-card:hover .act-thumb img {
        scale: 1.1;
      }

      .act-content {
        padding: 20px;
        flex-grow: 1;
      }
      .act-content h3 {
        margin: 10px 0;
        color: var(--primary-color);
        font-size: 1.3rem;
      }
      .act-content p {
        color: #666;
        font-size: 0.95rem;
        line-height: 1.6;
        margin-bottom: 20px;
      }

      /* Accordion Body */
      .act-details {
        max-height: 0;
        overflow: hidden;
        transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        background: #fcfcfc;
        border-top: 0 solid #eee;
      }
      .act-details.open {
        max-height: 2000px;
        border-top-width: 1px;
        padding: 25px;
      }

      .details-grid {
        display: grid;
        grid-template-columns: 1fr 1.5fr;
        gap: 25px;
      }
      .details-img {
        border-radius: 15px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .details-info h4 {
        color: var(--accent-color);
        margin-bottom: 10px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .details-info ul,
      .details-info ol {
        padding-right: 20px;
        margin-bottom: 20px;
        color: #555;
      }

      /* Dark Mode Support */
      body.dark-theme .filters-container,
      body.dark-theme .activity-card {
        background: #1e1e1e;
        border-color: #333;
      }
      body.dark-theme .filters-container select,
      body.dark-theme .filters-container input {
        background: #2d2d2d;
        border-color: #444;
        color: white;
      }
      body.dark-theme .act-content p {
        color: #aaa;
      }
      body.dark-theme .act-details {
        background: #1a1a1a;
      }
      body.dark-theme .details-info {
        color: #ccc;
      }

      @media (max-width: 768px) {
        .details-grid {
          grid-template-columns: 1fr;
        }
        .page-title h2 {
          font-size: 1.8rem;
        }
      }
    </style>
  </head>

  <body>
    <header class="site-header">
      <nav class="nav container">
        <a class="logo" href="index.html">Al-Hossam <span>Hassan</span></a>
        <ul class="nav-links">
          <li><a href="index.html">الرئيسية</a></li>
          <li><a href="stages.html">المراحل العمرية</a></li>
          <li><a href="activities.html" class="active">الأنشطة</a></li>
          <li><a href="pdfs.html">ملفات PDF</a></li>
          <li>
            <button class="theme-toggle" id="theme-toggle">
              <i class="fas fa-moon"></i>
            </button>
          </li>
          <li><a class="btn-contact-nav" href="contact.html">تواصل</a></li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <section class="activities-header">
        <div class="page-title">
          <h2>أنشطة تنموية مُصوّرة</h2>
          <p>
            مجموعة مختارة من التمارين والأنشطة لتعزيز مهارات طفلك في المنزل.
          </p>
        </div>
      </section>

      <div class="filters-container">
        <div class="filter-group">
          <label>تصفية حسب العمر</label>
          <select id="ageFilter">
            <option value="all">كل المراحل العمرية</option>
            <option value="0-6m">0 – 6 شهور</option>
            <option value="7-12m">7 – 12 شهر</option>
            <option value="1-2">من سنة إلى سنتين</option>
            <option value="2-3">من 2 إلى 3 سنوات</option>
            <option value="3-5">من 3 إلى 5 سنوات</option>
          </select>
        </div>
        <div class="filter-group">
          <label>نوع المهارة</label>
          <select id="skillFilter">
            <option value="all">كل المهارات</option>
            <option value="حركي">تنمية حركية</option>
            <option value="لغة">تنمية لغوية</option>
            <option value="اجتماعي">مهارات اجتماعية</option>
            <option value="رعاية">رعاية ذاتية</option>
          </select>
        </div>
        <div class="filter-group">
          <label>بحث سريع</label>
          <input
            type="search"
            id="searchInput"
            placeholder="عن ماذا تبحث؟..."
          />
        </div>
      </div>

      <div class="article-grid" id="activitiesGrid"></div>

      <div
        id="emptyState"
        class="callout"
        style="display: none; text-align: center; padding: 40px"
      >
        <i
          class="fas fa-search-minus fa-3x"
          style="color: #ccc; margin-bottom: 15px"
        ></i>
        <p>عذراً، لم نجد أنشطة تطابق بحثك. جرب خيارات تصفية أخرى.</p>
      </div>
    </main>

    <footer class="main-footer">
      <div class="container footer-content">
        <p>© <span id="year"></span> Al-Hossam Hassan — جميع الحقوق محفوظة</p>
      </div>
    </footer>

    <script src="js/activities-data.js"></script>
    <script>
      document.getElementById("year").textContent = new Date().getFullYear();

      // Theme Toggle Logic
      const themeToggle = document.getElementById("theme-toggle");
      if (localStorage.getItem("theme") === "dark")
        document.body.classList.add("dark-theme");
      themeToggle.onclick = () => {
        document.body.classList.toggle("dark-theme");
        localStorage.setItem(
          "theme",
          document.body.classList.contains("dark-theme") ? "dark" : "light",
        );
      };

      const grid = document.getElementById("activitiesGrid");
      const emptyState = document.getElementById("emptyState");

      function createActivityCard(act) {
        const card = document.createElement("div");
        card.className = "activity-card";

        card.innerHTML = `
                <div class="act-thumb">
                    <img src="${act.cover || "images/placeholder.jpg"}" alt="${act.title}">
                </div>
                <div class="act-content">
                    <span class="badge">${act.ageLabel || act.age} • ${act.skill}</span>
                    <h3>${act.title}</h3>
                    <p>${act.desc}</p>
                    <button class="btn btn-sub toggle-details">عرض خطوات النشاط</button>
                </div>
                <div class="act-details">
                    <div class="details-grid">
                        <div class="details-img">
                            <img src="${act.cover || "images/placeholder.jpg"}" style="width:100%">
                        </div>
                        <div class="details-info">
                            <h4><i class="fas fa-tools"></i> الأدوات المطلوبة:</h4>
                            <ul>${(act.tools || []).map((t) => `<li>${t}</li>`).join("")}</ul>
                            
                            <h4><i class="fas fa-list-ol"></i> طريقة التنفيذ:</h4>
                            <ol>${(act.steps || []).map((s) => `<li>${s}</li>`).join("")}</ol>
                            
                            ${
                              act.tip
                                ? `
                                <div class="callout" style="background:rgba(39,174,96,0.1); border:none; margin-top:20px;">
                                    <strong><i class="fas fa-lightbulb"></i> نصيحة:</strong> ${act.tip}
                                </div>
                            `
                                : ""
                            }
                        </div>
                    </div>
                </div>
            `;

        const btn = card.querySelector(".toggle-details");
        const details = card.querySelector(".act-details");

        btn.onclick = () => {
          const isOpen = details.classList.contains("open");
          details.classList.toggle("open");
          btn.textContent = isOpen ? "عرض خطوات النشاط" : "إخفاء التفاصيل";
        };

        return card;
      }

      function render() {
        const age = document.getElementById("ageFilter").value;
        const skill = document.getElementById("skillFilter").value;
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();

        grid.innerHTML = "";
        let found = 0;

        if (window.ACTIVITIES) {
          window.ACTIVITIES.forEach((act) => {
            const matchAge = age === "all" || act.age === age;
            const matchSkill = skill === "all" || act.skill === skill;
            const matchSearch =
              act.title.toLowerCase().includes(query) ||
              act.desc.toLowerCase().includes(query);

            if (matchAge && matchSkill && matchSearch) {
              grid.appendChild(createActivityCard(act));
              found++;
            }
          });
        }

        emptyState.style.display = found === 0 ? "block" : "none";
      }

      document.getElementById("ageFilter").onchange = render;
      document.getElementById("skillFilter").onchange = render;
      document.getElementById("searchInput").oninput = render;

      render();
    </script>
  </body>
</html>
