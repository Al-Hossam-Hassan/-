<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>مكتبة الملفات التربوية | Al-Hossam Hassan</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <link rel="stylesheet" href="css/style.css" />

    <style>
      :root {
        --pdf-red: #e74c3c;
        --accent-color: #27ae60;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
        --white: #ffffff;
        --transition: all 0.3s ease;
      }
      .wrap {
        padding: 50px 0;
      }
      .page-intro {
        margin-bottom: 40px;
        border-right: 5px solid var(--accent-color);
        padding-right: 20px;
      }
      .filters-bar {
        background: var(--white);
        padding: 25px;
        border-radius: 20px;
        box-shadow: var(--shadow);
        margin-bottom: 40px;
        display: flex;
        gap: 20px;
        flex-wrap: wrap;
        align-items: center;
      }
      .filters-bar input {
        flex: 1;
        min-width: 300px;
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #eee;
      }
      .filters-bar select {
        padding: 12px;
        border-radius: 12px;
        border: 1px solid #eee;
      }

      .pdf-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
        gap: 30px;
      }
      .pdf-card {
        background: var(--white);
        border-radius: 25px;
        overflow: hidden;
        transition: var(--transition);
        box-shadow: var(--shadow);
        border: 1px solid rgba(0, 0, 0, 0.03);
      }
      .pdf-card:hover {
        transform: translateY(-10px);
      }
      .pdf-thumb {
        height: 200px;
        position: relative;
        background: #f8f9fa;
      }
      .pdf-thumb img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .pdf-type-badge {
        position: absolute;
        top: 15px;
        left: 15px;
        background: var(--pdf-red);
        color: white;
        padding: 5px 12px;
        border-radius: 8px;
        font-weight: bold;
      }
      .pdf-meta {
        padding: 25px;
      }
      .age-badge {
        background: #e8f5e9;
        color: #2e7d32;
        padding: 4px 12px;
        border-radius: 50px;
        font-size: 0.8rem;
        font-weight: bold;
        margin-bottom: 12px;
        display: inline-block;
      }
      .pdf-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 20px;
        padding-top: 15px;
        border-top: 1px solid #f5f5f5;
      }

      .modal-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.7);
        backdrop-filter: blur(5px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 3000;
      }
      .email-modal {
        background: white;
        padding: 40px;
        border-radius: 30px;
        width: 90%;
        max-width: 400px;
        text-align: center;
      }
      .email-modal input {
        width: 100%;
        padding: 12px;
        margin: 20px 0;
        border-radius: 10px;
        border: 1px solid #ddd;
      }

      .viewer-section {
        display: none;
        margin-bottom: 30px;
        border-radius: 20px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }
      .btn {
        cursor: pointer;
        border: none;
        border-radius: 10px;
        transition: 0.3s;
        font-family: inherit;
        font-weight: 600;
      }
      .btn-sub {
        background: #eee;
        color: #333;
      }
    </style>
  </head>

  <body class="light-theme">
    <main class="container">
      <section class="wrap">
        <div class="page-intro">
          <h2>مكتبة الملفات التربوية</h2>
          <p>
            أدلة علمية وأوراق عمل صممت بناءً على منهج بورتاج لتنمية مهارات طفلك.
          </p>
        </div>

        <div class="filters-bar">
          <i class="fas fa-search" style="color: var(--accent-color)"></i>
          <input
            id="searchInput"
            type="search"
            placeholder="ابحث باسم الملف أو المرحلة..."
          />
          <select id="ageFilter">
            <option value="all">كل المراحل العمرية</option>
            <option value="0 – 0.5">0 – 6 شهور</option>
            <option value="0.5 – 1">6 – 12 شهر</option>
            <option value="1 – 1.5">1 – 1.5 سنة</option>
            <option value="1.5 – 2">1.5 – 2 سنة</option>
            <option value="2 – 2.5">2 – 2.5 سنة</option>
          </select>
        </div>

        <div class="viewer-section" id="viewerArea">
          <div class="viewer-container" style="background: #2c3e50">
            <div
              class="viewer-toolbar"
              style="
                padding: 15px 25px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                color: white;
              "
            >
              <h3 id="viewerTitle" style="margin: 0; font-size: 1rem"></h3>
              <div style="display: flex; gap: 10px">
                <button class="btn btn-sub" id="viewerBack">
                  إغلاق المعاينة
                </button>
                <button
                  class="btn"
                  id="viewerDownload"
                  style="
                    background: var(--accent-color);
                    color: white;
                    padding: 8px 20px;
                  "
                >
                  تحميل الآن
                </button>
              </div>
            </div>
            <iframe
              id="viewerFrame"
              src=""
              style="width: 100%; height: 70vh; border: none; background: white"
            ></iframe>
          </div>
        </div>

        <div class="pdf-grid" id="pdfGrid"></div>
      </section>
    </main>

    <div class="modal-overlay" id="emailModal">
      <div class="email-modal">
        <h3>خطوة واحدة للتحميل</h3>
        <p style="color: #666; font-size: 0.9rem">
          يرجى إدخال بريدك الإلكتروني لتتمكن من تحميل الملفات
        </p>
        <input
          id="emailInput"
          type="email"
          placeholder="example@mail.com"
          required
        />
        <div style="display: flex; gap: 10px">
          <button
            class="btn"
            id="emailContinue"
            style="flex: 2; background: var(--accent-color); color: white"
          >
            تأكيد وتحميل
          </button>
          <button class="btn btn-sub" id="emailCancel" style="flex: 1">
            إلغاء
          </button>
        </div>
      </div>
    </div>

    <script src="js/pdfs-data.js"></script>

    <script>
      const pdfGrid = document.getElementById("pdfGrid");
      const emailModal = document.getElementById("emailModal");
      const viewerArea = document.getElementById("viewerArea");
      const viewerFrame = document.getElementById("viewerFrame");
      let currentItem = null;

      // 1. وظيفة رندر الكروت
      function renderPDFs() {
        const PDFS = window.PDFS || [];
        const query = document
          .getElementById("searchInput")
          .value.toLowerCase();
        const ageFilter = document.getElementById("ageFilter").value;

        pdfGrid.innerHTML = "";

        const filtered = PDFS.filter((p) => {
          const matchesSearch =
            p.title.toLowerCase().includes(query) ||
            p.desc.toLowerCase().includes(query);
          const matchesAge = ageFilter === "all" || p.age === ageFilter;
          return matchesSearch && matchesAge;
        });

        filtered.forEach((p) => {
          const dlCount = localStorage.getItem("dl_" + p.id) || 0;
          const card = document.createElement("div");
          card.className = "pdf-card";
          card.innerHTML = `
            <div class="pdf-thumb">
                <span class="pdf-type-badge">PDF</span>
                <img src="${p.thumb}" alt="${p.title}" onerror="this.src='images/placeholder.png'">
            </div>
            <div class="pdf-meta">
                <span class="age-badge">${p.ageLabel}</span>
                <h3>${p.title}</h3>
                <p>${p.desc}</p>
                <div class="pdf-actions">
                    <div class="dl-info" style="color:#888; font-size:0.9rem;">
                        <i class="fas fa-download"></i> <span id="count-${p.id}">${dlCount}</span>
                    </div>
                    <div style="display:flex; gap:8px;">
                        <button onclick="viewFile('${p.id}')" class="btn btn-sub" style="padding: 8px 15px;">عرض</button>
                        <button onclick="handleAction('${p.id}', 'download')" class="btn" style="background:var(--accent-color); color:white; padding: 8px 15px;">تحميل</button>
                    </div>
                </div>
            </div>
          `;
          pdfGrid.appendChild(card);
        });
      }

      // 2. وظيفة العرض (Preview)
      window.viewFile = (id) => {
        const item = window.PDFS.find((p) => p.id === id);
        if (!item) return;

        viewerArea.style.display = "block";
        document.getElementById("viewerTitle").innerText = item.title;
        viewerFrame.src = item.file;

        // ربط زرار التحميل داخل المعاينة
        document.getElementById("viewerDownload").onclick = () =>
          handleAction(id, "download");

        // سكرول لمكان العرض
        viewerArea.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      // 3. إدارة الإيميل والتحميل
      window.handleAction = (id, type) => {
        currentItem = window.PDFS.find((p) => p.id === id);
        if (!localStorage.getItem("user_email")) {
          emailModal.style.display = "flex";
        } else {
          finalizeDownload();
        }
      };

      function finalizeDownload() {
        if (!currentItem) return;

        // زيادة العداد
        let count = parseInt(localStorage.getItem("dl_" + currentItem.id) || 0);
        localStorage.setItem("dl_" + currentItem.id, count + 1);

        // تحديث الرقم في الصفحة بدون Refresh
        const countSpan = document.getElementById("count-" + currentItem.id);
        if (countSpan) countSpan.innerText = count + 1;

        // فتح الملف للتحميل
        const link = document.createElement("a");
        link.href = currentItem.file;
        link.download = currentItem.title + ".pdf";
        link.target = "_blank";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);

        emailModal.style.display = "none";
      }

      // 4. الأحداث (Events)
      document.getElementById("emailContinue").onclick = () => {
        const email = document.getElementById("emailInput").value;
        if (email.includes("@") && email.length > 5) {
          localStorage.setItem("user_email", email);
          finalizeDownload();
        } else {
          alert("يرجى إدخال بريد إلكتروني صحيح");
        }
      };

      document.getElementById("emailCancel").onclick = () =>
        (emailModal.style.display = "none");
      document.getElementById("viewerBack").onclick = () => {
        viewerArea.style.display = "none";
        viewerFrame.src = "";
      };

      document.getElementById("searchInput").oninput = renderPDFs;
      document.getElementById("ageFilter").onchange = renderPDFs;

      // التشغيل عند التحميل
      window.onload = renderPDFs;
    </script>
  </body>
</html>
