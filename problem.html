<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>تفاصيل المشكلة | Al-Hossam Hassan</title>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />

    <style>
      /* --- الأساسيات والمتغيرات --- */
      @import url("https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;700&display=swap");

      :root {
        --primary-color: #2c3e50;
        --accent-color: #27ae60;
        --light-bg: #f8fafc;
        --text-main: #34495e;
        --white: #ffffff;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        --transition: all 0.3s ease;
      }

      /* تحسينات الوضع الليلي */
      .dark-theme {
        --primary-color: #ecf0f1;
        --light-bg: #1a1a1a;
        --text-main: #bdc3c7;
        --white: #2c2c2c;
        --shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Cairo", sans-serif;
      }

      body {
        background-color: var(--light-bg);
        color: var(--text-main);
        transition:
          background 0.3s,
          color 0.3s;
      }

      .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 0 20px;
      }

      /* --- الهيدر --- */
      .site-header {
        background: var(--white);
        padding: 15px 0;
        box-shadow: var(--shadow);
        position: sticky;
        top: 0;
        z-index: 1000;
      }

      .nav {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .logo {
        font-size: 1.5rem;
        font-weight: 700;
        text-decoration: none;
        color: var(--primary-color);
      }
      .logo span {
        color: var(--accent-color);
      }
      .nav-links {
        display: flex;
        list-style: none;
        gap: 15px;
        align-items: center;
      }
      .nav-links a {
        text-decoration: none;
        color: var(--text-main);
        font-weight: 600;
        font-size: 0.9rem;
      }

      .theme-toggle {
        background: none;
        border: none;
        cursor: pointer;
        color: var(--text-main);
        font-size: 1.2rem;
      }

      /* --- تصميم رأس المشكلة --- */
      .problem-head {
        margin-top: 40px;
        position: relative;
      }

      .problem-cover {
        width: 100%;
        height: 350px;
        border-radius: 30px;
        overflow: hidden;
        box-shadow: var(--shadow);
      }

      .problem-cover img {
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      .hero-card {
        background: var(--white);
        padding: 35px;
        border-radius: 25px;
        box-shadow: var(--shadow);
        max-width: 80%;
        margin: -60px auto 40px;
        position: relative;
        text-align: center;
        border: 1px solid rgba(0, 0, 0, 0.05);
      }

      .tag {
        background: var(--accent-color);
        color: white;
        padding: 4px 15px;
        border-radius: 50px;
        font-size: 0.8rem;
        display: inline-block;
        margin-bottom: 15px;
      }

      #problemTitle {
        color: var(--primary-color);
        font-size: 1.8rem;
        margin-bottom: 15px;
      }

      /* --- نظام الـ Accordion --- */
      .info-grid {
        display: grid;
        gap: 15px;
        margin-bottom: 50px;
      }

      .info-card {
        background: var(--white);
        border-radius: 15px;
        border: 1px solid rgba(0, 0, 0, 0.05);
        padding: 20px;
        cursor: pointer;
        transition: var(--transition);
      }

      .info-card:hover {
        border-color: var(--accent-color);
      }

      .info-card h3 {
        display: flex;
        justify-content: space-between;
        align-items: center;
        font-size: 1.1rem;
        color: var(--primary-color);
      }

      .info-card h3 i.icon-main {
        color: var(--accent-color);
        margin-left: 10px;
      }

      .content-area {
        max-height: 0;
        overflow: hidden;
        opacity: 0;
        transition: all 0.4s ease;
      }

      .info-card.open .content-area {
        max-height: 1500px;
        opacity: 1;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px dashed #ddd;
      }

      .fa-chevron-down {
        transition: transform 0.3s;
        font-size: 0.9rem;
        color: #999;
      }

      /* الفوتر */
      .main-footer {
        text-align: center;
        padding: 40px 0;
        border-top: 1px solid #eee;
        margin-top: 50px;
      }

      /* أزرار */
      .btn-back {
        text-decoration: none;
        color: var(--text-main);
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 20px;
        font-weight: bold;
      }
    </style>
  </head>
  <body class="light-theme">
    <header class="site-header">
      <nav class="nav container">
        <a class="logo" href="index.html">Al-Hossam <span>Hassan</span></a>
        <ul class="nav-links">
          <li><a href="index.html">الرئيسية</a></li>
          <li><a href="stages.html">المراحل</a></li>
          <li><a href="activities.html">الأنشطة</a></li>
          <li>
            <button class="theme-toggle" id="theme-toggle">
              <i class="fas fa-moon"></i>
            </button>
          </li>
          <li>
            <a
              class="btn-contact-nav"
              href="contact.html"
              style="
                background: var(--accent-color);
                color: white;
                padding: 5px 15px;
                border-radius: 20px;
              "
              >تواصل</a
            >
          </li>
        </ul>
      </nav>
    </header>

    <main class="container">
      <section style="padding: 40px 0">
        <a class="btn-back" id="backBtn" href="stages.html">
          <i class="fas fa-arrow-right"></i> رجوع للمرحلة
        </a>

        <div class="problem-head">
          <div class="problem-cover">
            <img
              id="coverImg"
              src="images/placeholder.jpg"
              alt="غلاف المشكلة"
            />
          </div>
          <div class="hero-card">
            <span class="tag" id="stageTag">جاري التحميل...</span>
            <h2 id="problemTitle">عنوان المشكلة</h2>
            <p id="problemExcerpt">تحميل الوصف...</p>
          </div>
        </div>

        <div class="info-grid" id="infoGrid"></div>
      </section>
    </main>

    <footer class="main-footer">
      <p>© <span id="year"></span> Al-Hossam Hassan — جميع الحقوق محفوظة</p>
    </footer>

    <script src="js/problems-data.js"></script>
    <script src="js/stages-data.js"></script>

    <script>
      // --- نظام الثيم (Dark Mode) ---
      const themeToggle = document.getElementById("theme-toggle");
      const themeIcon = themeToggle.querySelector("i");

      if (localStorage.getItem("theme") === "dark") {
        document.body.classList.add("dark-theme");
        themeIcon.classList.replace("fa-moon", "fa-sun");
      }

      themeToggle.addEventListener("click", () => {
        document.body.classList.toggle("dark-theme");
        const isDark = document.body.classList.contains("dark-theme");
        localStorage.setItem("theme", isDark ? "dark" : "light");
        themeIcon.classList.replace(
          isDark ? "fa-moon" : "fa-sun",
          isDark ? "fa-sun" : "fa-moon",
        );
      });

      // --- منطق عرض البيانات ---
      function getParam(name) {
        return new URLSearchParams(location.search).get(name);
      }
      const id = getParam("id");
      const problems = Array.isArray(window.PROBLEMS) ? window.PROBLEMS : [];
      const prob = problems.find((p) => p && p.id === id);

      const grid = document.getElementById("infoGrid");

      function addCard(title, items, iconClass) {
        const card = document.createElement("div");
        card.className = "info-card";

        card.innerHTML = `
          <h3>
            <span><i class="${iconClass} icon-main"></i>${title}</span>
            <i class="fas fa-chevron-down"></i>
          </h3>
          <div class="content-area">
            ${
              Array.isArray(items) && items.length > 0
                ? `<ul style="list-style: disc; padding-right: 20px;">${items.map((txt) => `<li style="margin-bottom:10px">${txt}</li>`).join("")}</ul>`
                : `<p style="color:#999">سيتم إضافة المحتوى قريباً...</p>`
            }
          </div>
        `;

        card.addEventListener("click", () => {
          card.classList.toggle("open");
          const chev = card.querySelector(".fa-chevron-down");
          chev.style.transform = card.classList.contains("open")
            ? "rotate(180deg)"
            : "rotate(0)";
        });

        grid.appendChild(card);
      }

      if (prob) {
        document.title = prob.title + " | Al-Hossam Hassan";
        document.getElementById("problemTitle").textContent = prob.title;
        document.getElementById("problemExcerpt").textContent = prob.excerpt;
        document.getElementById("coverImg").src =
          prob.cover || "images/placeholder.jpg";
        document.getElementById("stageTag").textContent =
          prob.stageLabel || "مرحلة تعليمية";

        if (prob.stage) {
          document.getElementById("backBtn").href =
            "stage.html?stage=" + encodeURIComponent(prob.stage);
        }

        const s = prob.sections || {};
        addCard("الأعراض (إزاي تعرف المشكلة؟)", s.symptoms, "fas fa-search");
        addCard("ليه ده بيحصل؟ (الأسباب)", s.why, "fas fa-lightbulb");
        addCard("الحل العملي (خطوات تطبيقية)", s.solution, "fas fa-magic");
        addCard("ملاحظة هامة للمربي", s.note, "fas fa-comment-dots");
      }

      document.getElementById("year").textContent = new Date().getFullYear();
    </script>
  </body>
</html>
